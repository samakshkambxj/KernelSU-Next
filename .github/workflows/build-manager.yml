name: Build Custom KernelSU Manager

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'manager/**'
      - '.github/workflows/build-manager.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'manager/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        working-directory: manager
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: manager
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: manager
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: custom-ksu-manager-release
          path: manager/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: custom-ksu-manager-debug
          path: manager/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Get APK info
        if: success()
        run: |
          echo "=== Build Complete ==="
          echo "Release APK:"
          ls -lh manager/app/build/outputs/apk/release/*.apk 2>/dev/null || echo "No release APK found"
          echo ""
          echo "Debug APK:"
          ls -lh manager/app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "No debug APK found"
